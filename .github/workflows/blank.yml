# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
- name: Claude Code Base Action
  # You may pin to the exact commit or the version.
  # uses: anthropics/claude-code-base-action@a0d79f9c1798b06292dbc80f8f95cf742ce7a213
  uses: anthropics/claude-code-base-action@v0.0.14
  with:
    # The prompt to send to Claude Code (mutually exclusive with prompt_file)
    prompt: # optional, default is 
    # Path to a file containing the prompt to send to Claude Code (mutually exclusive with prompt)
    prompt_file: # optional, default is 
    # Comma-separated list of allowed tools for Claude Code to use
    allowed_tools: # optional, default is 
    # Comma-separated list of disallowed tools that Claude Code cannot use
    disallowed_tools: # optional, default is 
    # Maximum number of conversation turns (default: no limit)
    max_turns: # optional, default is 
    # MCP configuration as JSON string or path to MCP configuration JSON file
    mcp_config: # optional, default is 
    # Override system prompt
    system_prompt: # optional, default is 
    # Append to system prompt
    append_system_prompt: # optional, default is 
    # Model to use (provider-specific format required for Bedrock/Vertex)
    model: # optional
    # DEPRECATED: Use 'model' instead. Model to use (provider-specific format required for Bedrock/Vertex)
    anthropic_model: # optional
    # Custom environment variables to pass to Claude Code execution (YAML multiline format)
    claude_env: # optional, default is 
    # Timeout in minutes for Claude Code execution
    timeout_minutes: # optional, default is 10
    # Anthropic API key (required for direct Anthropic API)
    anthropic_api_key: # optional, default is 
    # Use Amazon Bedrock with OIDC authentication instead of direct Anthropic API
    use_bedrock: # optional, default is false
    # Use Google Vertex AI with OIDC authentication instead of direct Anthropic API
    use_vertex: # optional, default is false
    # Whether to use Node.js dependency caching (set to true only for Node.js projects with lock files)
    use_node_cache: # optional, default is false
